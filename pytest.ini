[pytest]
# Collect only from tests/. The benchmark and audit runners are not
# part of this repository — the tests here are the contract.
testpaths = tests
# The fixture harness and the orphaned chunker generation live on disk
# as reference material, outside the repository. Without this, a local
# run would collect them and disagree with CI.
norecursedirs = tests/benchmarks tests/legacy
filterwarnings =
    ignore::DeprecationWarning
